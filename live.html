<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live瞬间</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background: linear-gradient(180deg, #CE5B9C 0%, #EEC0DA 24.2%, #F5D7E9 66%, #FCEEF7 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .live-container {
            text-align: center;
            background: rgba(255, 255, 255, 0.8);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(20px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        
        .live-title {
            font-size: 36px;
            font-weight: 700;
            color: #1C1C1C;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="live-container">
        <h1 class="live-title">live瞬间</h1>
    </div>
</body>
</html>
